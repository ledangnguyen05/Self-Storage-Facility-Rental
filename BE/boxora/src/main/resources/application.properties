# ==========================================
# Application
# ==========================================
spring.application.name=boxora
# Public URL of the web app (no trailing slash). Used for password-reset / welcome email links, the VNPay and
# DocuSeal return redirects and the CORS allow-list. Defaults to the Vite dev server; set APP_FRONTEND_URL
# in every other environment (prod fails fast when it is left blank, see EnvironmentSecurityValidator).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Extra browser origins allowed to call the API (comma separated), e.g. a second dev-server port.
app.cors.extra-origins=${CORS_EXTRA_ORIGINS:}

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boxora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ==========================================
# Mail
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# From address shown to recipients; falls back to MAIL_USERNAME, then to no-reply@boxora.local.
app.mail.from=${MAIL_FROM:}

# Gmail needs auth + STARTTLS (the defaults). A local mail catcher such as Mailpit (docker-compose.yml) needs
# MAIL_HOST=localhost MAIL_PORT=1025 MAIL_SMTP_AUTH=false MAIL_SMTP_STARTTLS_ENABLE=false MAIL_SMTP_STARTTLS_REQUIRED=false.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
# Never let an unreachable SMTP server hang a request: OTP and PIN mails are sent synchronously.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:8000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:8000}
# JavaMail resolves this machine's canonical host name (a reverse-DNS lookup that blocks for ~5 s on Windows)
# twice per mail unless it is told the name: once for the EHLO greeting (mail.smtp.localhost) and once for the
# Message-ID suffix (mail.host). That made every OTP / PIN / reset mail take about 5 s. Set MAIL_SMTP_LOCALHOST to the
# public host name of the deployment if the SMTP provider or spam filters want a real one.
spring.mail.properties.mail.smtp.localhost=${MAIL_SMTP_LOCALHOST:localhost}
spring.mail.properties.mail.host=${MAIL_SMTP_LOCALHOST:localhost}
# Do not wait for the server's reply to QUIT after the message was accepted.
spring.mail.properties.mail.smtp.quitwait=false

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Refresh-token cookie (HttpOnly). Same-origin (Vite proxy / reverse proxy) works with the defaults.
# FE and API on different SITES (different registrable domains) need COOKIE_SAME_SITE=None AND COOKIE_SECURE=true (HTTPS).
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
# In-memory throttling of login / register / forgot-password (per IP and per email). Set to false only in load tests.
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Wrong passwords tolerated within 15 minutes before login answers 429: per (IP + email), per IP, per email.
app.security.login.max-failures-per-ip-and-email=${LOGIN_MAX_FAILURES_PER_IP_AND_EMAIL:5}
app.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:40}
app.security.login.max-failures-per-email=${LOGIN_MAX_FAILURES_PER_EMAIL:30}
# Forgot-password always takes at least this long, so response time cannot tell registered addresses apart.
app.security.forgot-password.min-response-ms=${FORGOT_PASSWORD_MIN_RESPONSE_MS:300}
# Devices one account may be signed in on at the same time (the oldest session is ended beyond this).
app.security.max-sessions-per-user=${MAX_SESSIONS_PER_USER:5}

# ==========================================
# Async Thread Pool
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# ==========================================
# Server
# ==========================================
server.port=${SERVER_PORT:8080}
# Behind a reverse proxy / load balancer set FORWARD_HEADERS_STRATEGY=framework (or native) so the real client IP
# (X-Forwarded-For) is used by the register / forgot-password rate limiter and the audit log. Leave "none" when the
# API is reachable directly: the header would be spoofable.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ==========================================
# Swagger
# ==========================================
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}

# ==========================================
# Logging
# ==========================================
logging.level.com.boxora=${LOGGING_APP_LEVEL:DEBUG}
logging.level.org.springframework.security=${LOGGING_SECURITY_LEVEL:INFO}

# ==========================================
# Seed Users
# ==========================================
seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
seed.facility-manager-password=${SEED_FACILITY_MANAGER_PASSWORD:Manager@123}
seed.business-manager-password=${SEED_BUSINESS_MANAGER_PASSWORD:Manager@123}
seed.staff-password=${SEED_STAFF_PASSWORD:Staff@123}
seed.customer-password=${SEED_CUSTOMER_PASSWORD:Customer@123}

# ==========================================
# VNPay Sandbox
# ==========================================
vnpay.tmn-code=${VNPAY_TMN_CODE:U7PZC0X5}
vnpay.hash-secret=${VNPAY_HASH_SECRET:VLRAQQHFJORSSMHIDNAJMKPGGHTSRQRE}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.command=${VNPAY_COMMAND:pay}
vnpay.curr-code=${VNPAY_CURR_CODE:VND}
vnpay.locale=${VNPAY_LOCALE:vn}
vnpay.order-type=${VNPAY_ORDER_TYPE:other}


# ==========================================
# Docuseal
# ==========================================
docuseal.api-url=${DOCUSEAL_API_URL:https://api.docuseal.com}
docuseal.api-key=${DOCUSEAL_API_KEY:}
docuseal.template-id=${DOCUSEAL_TEMPLATE_ID:1}
docuseal.renewal-template-id=${DOCUSEAL_RENEWAL_TEMPLATE_ID:1}
docuseal.webhook-token=${DOCUSEAL_WEBHOOK_TOKEN:boxora_docuseal_webhook_secret}
docuseal.mock-enabled=${DOCUSEAL_MOCK_ENABLED:false}

# ==========================================
# Scheduling / Cron
# ==========================================
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
app.scheduling.overdue-cron=${SCHEDULING_OVERDUE_CRON:0 0 1 * * ?}
app.scheduling.auto-cancel-cron=${AUTO_CANCEL_CRON:0 */15 * * * ?}
app.scheduling.pending-payment-timeout-minutes=${PENDING_TIMEOUT_MINUTES:1440}
app.booking.payment-timeout-minutes=${BOOKING_PAYMENT_TIMEOUT_MINUTES:1440}

# ==========================================
# Redis (Distributed Soft-lock 24h & Cache)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
app.redis.enabled=${REDIS_ENABLED:true}

# ==========================================
# Booking Soft-Lock & Reservation Rules
# ==========================================
app.booking.soft-lock-hours=${BOOKING_SOFT_LOCK_HOURS:24}
app.booking.max-advance-days=${BOOKING_MAX_ADVANCE_DAYS:30}

# ==========================================
# Multipart & File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Google OAuth2 / Social Login
# ==========================================
# Google sign-in is refused (error 307) while GOOGLE_CLIENT_ID is blank; when it is set, the ID token's
# audience must equal it. VITE_GOOGLE_CLIENT_ID on the frontend must be the same value.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}


# ==========================================
# Google Gemini Chatbot
# ==========================================
gemini.api-keys=${GEMINI_API_KEYS:}

