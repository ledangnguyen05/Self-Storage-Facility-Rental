# ==========================================
# Application & Environment Config
# ==========================================
spring.application.name=boxora
spring.config.import=optional:file:.env[.properties],optional:file:BE/boxora/.env[.properties]


# ==========================================
# Database
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}


# ==========================================
# Mail
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}


# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}


# ==========================================
# Async Thread Pool
# ==========================================
spring.task.execution.pool.core-size=${ASYNC_CORE_SIZE:5}
spring.task.execution.pool.max-size=${ASYNC_MAX_SIZE:10}


# ==========================================
# Server & Frontend
# ==========================================
server.port=${SERVER_PORT:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}


# ==========================================
# Swagger
# ==========================================
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}


# ==========================================
# Logging
# ==========================================
logging.level.com.boxora=${LOGGING_APP_LEVEL:DEBUG}
logging.level.org.springframework.security=${LOGGING_SECURITY_LEVEL:INFO}


# ==========================================
# Seed Users
# ==========================================
seed.admin-password=${SEED_ADMIN_PASSWORD:admin}
seed.facility-manager-password=${SEED_FACILITY_MANAGER_PASSWORD:facility}
seed.business-manager-password=${SEED_BUSINESS_MANAGER_PASSWORD:business}
seed.staff-password=${SEED_STAFF_PASSWORD:staff}
seed.customer-password=${SEED_CUSTOMER_PASSWORD:customer}