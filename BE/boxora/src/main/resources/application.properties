# ==========================================
# Application
# ==========================================
spring.application.name=boxora
app.frontend-url=${APP_FRONTEND_URL:}

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boxora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ==========================================
# Mail
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ==========================================
# Async Thread Pool
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# ==========================================
# Server
# ==========================================
server.port=${SERVER_PORT:8080}

# ==========================================
# Swagger
# ==========================================
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}

# ==========================================
# Logging
# ==========================================
logging.level.com.boxora=${LOGGING_APP_LEVEL:DEBUG}
logging.level.org.springframework.security=${LOGGING_SECURITY_LEVEL:INFO}

# ==========================================
# Seed Users
# ==========================================
seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
seed.facility-manager-password=${SEED_FACILITY_MANAGER_PASSWORD:Manager@123}
seed.business-manager-password=${SEED_BUSINESS_MANAGER_PASSWORD:Manager@123}
seed.staff-password=${SEED_STAFF_PASSWORD:Staff@123}
seed.customer-password=${SEED_CUSTOMER_PASSWORD:Customer@123}

# ==========================================
# VNPay Sandbox
# ==========================================
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.version=${VNPAY_VERSION:}
vnpay.command=${VNPAY_COMMAND:}
vnpay.curr-code=${VNPAY_CURR_CODE:}
vnpay.locale=${VNPAY_LOCALE:vn}
vnpay.order-type=${VNPAY_ORDER_TYPE:other}


# ==========================================
# Docuseal
# ==========================================
docuseal.api-url=${DOCUSEAL_API_URL:https://api.docuseal.com}
docuseal.api-key=${DOCUSEAL_API_KEY:}
docuseal.template-id=${DOCUSEAL_TEMPLATE_ID:1}
docuseal.renewal-template-id=${DOCUSEAL_RENEWAL_TEMPLATE_ID:1}
docuseal.webhook-token=${DOCUSEAL_WEBHOOK_TOKEN:boxora_docuseal_webhook_secret}
docuseal.mock-enabled=${DOCUSEAL_MOCK_ENABLED:false}

# ==========================================
# Scheduling / Cron
# ==========================================
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
app.scheduling.overdue-cron=${SCHEDULING_OVERDUE_CRON:0 0 1 * * ?}
app.scheduling.auto-cancel-cron=${AUTO_CANCEL_CRON:0 */15 * * * ?}
app.scheduling.pending-payment-timeout-minutes=${PENDING_TIMEOUT_MINUTES:15}
app.booking.payment-timeout-minutes=${BOOKING_PAYMENT_TIMEOUT_MINUTES:15}

# ==========================================
# Redis (Distributed booking soft-lock & cache)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
app.redis.enabled=${REDIS_ENABLED:true}

# ==========================================
# Booking Soft-Lock & Reservation Rules
# ==========================================
app.booking.soft-lock-hours=${BOOKING_SOFT_LOCK_HOURS:1}
app.booking.max-advance-days=${BOOKING_MAX_ADVANCE_DAYS:30}

# ==========================================
# Multipart & File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Google OAuth2 / Social Login
# ==========================================
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}


# ==========================================
# Google Gemini Chatbot
# ==========================================
gemini.api-keys=${GEMINI_API_KEYS:}

# ==========================================
# Cloudflare R2 Storage (Direct Cloud Object Storage)
# ==========================================
app.r2.account-id=${R2_ACCOUNT_ID:0e057a93c13437ab7a9f464e23cd9b48}
app.r2.bucket-name=${R2_BUCKET_NAME:boxora-storage-units}
app.r2.public-url=${R2_PUBLIC_URL:https://pub-e15c7d96a163417fa2a23d5b849ee035.r2.dev}
app.r2.endpoint=${R2_ENDPOINT:https://0e057a93c13437ab7a9f464e23cd9b48.r2.cloudflarestorage.com}


