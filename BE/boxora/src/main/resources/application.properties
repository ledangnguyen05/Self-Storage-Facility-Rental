# ==========================================
# Application
# ==========================================
spring.application.name=boxora
app.frontend-url=${APP_FRONTEND_URL}

# ==========================================
# Database
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Mail
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}


# ==========================================
# Async Thread Pool
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10


# ==========================================
# Server
# ==========================================
server.port=8080


# ==========================================
# Swagger
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ==========================================
# Logging
# ==========================================
logging.level.com.storehub=DEBUG
logging.level.org.springframework.security=INFO


# ==========================================
# Seed Users
# ==========================================
seed.admin-password=${SEED_ADMIN_PASSWORD}
seed.facility-manager-password=${SEED_FACILITY_MANAGER_PASSWORD}
seed.business-manager-password=${SEED_BUSINESS_MANAGER_PASSWORD}
seed.staff-password=${SEED_STAFF_PASSWORD}
seed.customer-password=${SEED_CUSTOMER_PASSWORD}