# =========================================================================
# Production Configuration (Profile: prod, production)
# =========================================================================

# Strict JPA schema validation: Hibernate will never mutate schema at runtime
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway: Enforce strict schema migration validation
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Keep all demo/dev seed runners strictly disabled
boxora.seed.enabled=false

# Production logging: No query tracing or debug dumps
logging.level.com.boxora=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
